<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHL — ניתוב תיקים: קבלן / פנימי</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --red: #D40511;
    --yellow: #FFCC00;
    --dark: #1A1A1A;
    --light: #F5F5F5;
    --border: #DDD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: var(--light); color: var(--dark); }

  .topbar {
    background: var(--red);
    color: white;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 24px;
    height: 52px;
  }
  .topbar-logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .topbar-title { font-size: 15px; font-weight: 600; opacity: .9; }

  .main { max-width: 900px; margin: 32px auto; padding: 0 16px 60px; }

  .upload-zone {
    border: 2.5px dashed var(--border);
    border-radius: 10px;
    background: white;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--red); background: #FFF5F5; }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 40px; margin-bottom: 10px; }
  .upload-zone h3 { font-size: 17px; margin-bottom: 6px; }
  .upload-zone p { font-size: 13px; color: #777; }

  .file-info {
    display: none;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  .file-info.show { display: flex; }
  .file-icon { font-size: 28px; }
  .file-details { flex: 1; }
  .file-name { font-weight: 700; font-size: 14px; }
  .file-meta { font-size: 12px; color: #777; margin-top: 2px; }
  .remove-file { background: none; border: none; font-size: 18px; cursor: pointer; color: #999; }
  .remove-file:hover { color: var(--red); }

  .settings-box {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 12px;
    font-size: 13px;
  }
  .settings-box h4 { font-size: 13px; margin-bottom: 8px; }
  .settings-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .settings-row label { flex: 1; color: #444; }
  .settings-row input[type="number"] { width: 80px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; text-align: center; }
  .settings-row input[type="checkbox"] { width: 16px; height: 16px; }

  .legend {
    display: flex;
    gap: 10px;
    margin: 16px 0 10px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .dot-red { background: #EF5350; }
  .dot-yellow { background: #FDD835; }
  .dot-green { background: #66BB6A; }

  .run-btn {
    display: block;
    width: 100%;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 18px;
    transition: opacity .15s;
  }
  .run-btn:hover:not(:disabled) { opacity: .88; }
  .run-btn:disabled { opacity: .45; cursor: not-allowed; }

  .progress-wrap { display: none; margin-top: 16px; }
  .progress-wrap.show { display: block; }
  .progress-label { font-size: 13px; color: #444; margin-bottom: 6px; }
  .progress-bar { background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--red); height: 100%; width: 0; transition: width .3s; }

  .results-box { display: none; margin-top: 20px; }
  .results-box.show { display: block; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat-card .num { font-size: 24px; font-weight: 900; line-height: 1; }
  .stat-card .lbl { font-size: 12px; color: #777; margin-top: 4px; }
  .stat-card.c-red .num { color: #EF5350; }
  .stat-card.c-yellow .num { color: #F9A825; }
  .stat-card.c-green .num { color: #43A047; }
  .stat-card.c-blue .num { color: #1E88E5; }
  .stat-card.c-money .num { color: #6A1B9A; }

  .download-btn {
    display: block;
    width: 100%;
    background: var(--dark);
    color: var(--yellow);
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  .download-btn:hover { opacity: .85; }

  .error-msg {
    display: none;
    background: #FFEBEE;
    border: 1.5px solid #EF9A9A;
    border-radius: 8px;
    padding: 12px 16px;
    color: #C62828;
    font-size: 13px;
    margin-top: 12px;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">DHL</span>
  <span class="topbar-title">ניתוב תיקים — קבלן מול פנימי</span>
</div>

<div class="main">

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <div class="upload-icon">📂</div>
    <h3>גרור את קובץ הדוח לכאן</h3>
    <p>או לחץ לבחירת קובץ — .xlsx / .xls (הדוח עם FLIGHT / DESCRIPTION / VALUE_CATEGORY וכו')</p>
  </div>

  <div class="file-info" id="fileInfo">
    <span class="file-icon">📊</span>
    <div class="file-details">
      <div class="file-name" id="fileName"></div>
      <div class="file-meta" id="fileMeta"></div>
    </div>
    <button class="remove-file" onclick="clearFile()">✕</button>
  </div>

  <div class="settings-box">
    <h4>הגדרת ניתוב</h4>
    <div class="settings-row">
      <label>גם תיקי HV בסיכון ירוק ילכו לקבלן</label>
      <input type="checkbox" id="hvToContractor" checked>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot dot-red"></div>אדום — חשש גבוה, תמיד פנימי</div>
    <div class="legend-item"><div class="dot dot-yellow"></div>צהוב — חשש בינוני, תמיד פנימי</div>
    <div class="legend-item"><div class="dot dot-green"></div>ירוק — מועמד לקבלן</div>
  </div>

  <button class="run-btn" id="runBtn" onclick="runRouting()" disabled>הפעל ניתוב</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">מעבד...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="results-box" id="resultsBox">
    <div class="stats-grid" id="statsGrid"></div>
    <button class="download-btn" id="downloadBtn">⬇ הורד קובץ מנותב (.xlsx)</button>
  </div>

</div>

<script>
let fileBuffer = null;
let outputBlob = null;

// ── רשימות סיכון (מיובאות בדיוק מ-B3: customs/batch/index.html) ────────────────
const RED_DESC = [
  'GUN','PISTOL','RIFLE','AMMO','AMMUNITION','BULLET','EXPLOSIVE','GRENADE',
  'DRUG','MEDICINE','MEDICATION','PHARMACEUTICAL','TABLET','CAPSULE','SYRUP',
  'INJECTION','VACCINE','ANTIBIOTIC','NARCOTIC',
  'ALCOHOL','WHISKEY','WHISKY','VODKA','WINE ','BEER ','SPIRITS','COGNAC',
  'CHAMPAGNE','BRANDY','TEQUILA','LIQUEUR','JOHNNIE WALKER','JACK DANIEL',
  'GREY GOOSE','ABSOLUT','BACARDI','JAMESON','CHIVAS','CHÂTEAU','HENNESSY',
  'CIGARETTE','TOBACCO','VAPE','CIGAR',
  'PESTICIDE','HERBICIDE','INSECTICIDE',
  'CAR PARTS','AUTO PARTS','VEHICLE','ENGINE PART','TRANSMISSION','BUMPER',
  'WINDSHIELD','CAR TIRE','MOTORCYCLE','SCOOTER','CHASSIS','GEARBOX',
  'CHEMICAL','REAGENT','SOLVENT','ACID','ACETONE','TOLUENE','BENZENE',
  'FORMALDEHYDE','SULFURIC','HYDROCHLORIC','CAUSTIC','CORROSIVE','TOXIC SUBSTANCE',
  'SUNGLASS','SUN GLASS'
];

const YEL_DESC = [
  'SUPPLEMENT','VITAMIN','PROTEIN POWDER','PROBIOTIC','OMEGA','COLLAGEN',
  'WHEY','CREATINE','BCAA','PRE-WORKOUT','NUTRITIONAL','DIETARY','HERBAL',
  'CREAM','SERUM','LOTION','MOISTURIZER','SUNSCREEN','FOUNDATION',
  'LIPSTICK','MASCARA','EYESHADOW','BLUSH','CONCEALER','SHAMPOO','CONDITIONER',
  'PERFUME','EAU DE','COLOGNE','DEODORANT',
  'BABY ','INFANT','TODDLER',
  'COFFEE','SNACK','CANDY','CHOCOLATE','FOOD','RED BULL','ENERGY DRINK',
  'WATCH','BRACELET','NECKLACE','RING ','EARRING','PENDANT','DIAMOND','GEMSTONE',
  'CHARGER','ADAPTER','POWER BANK','BATTERY'
];

function getRisk(desc) {
  const d = String(desc || '').toUpperCase();
  for (const kw of RED_DESC) if (d.includes(kw)) return ['red', `תיאור: ${kw}`];
  for (const kw of YEL_DESC) if (d.includes(kw)) return ['yellow', `תיאור: ${kw}`];
  return ['green', 'ללא התאמת סיכון'];
}

// ── קבצים ──────────────────────────────────────────────────────────────────────
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file) return;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileMeta').textContent = (file.size/1024).toFixed(0) + ' KB';
  document.getElementById('fileInfo').classList.add('show');
  document.getElementById('runBtn').disabled = false;
  const reader = new FileReader();
  reader.onload = e => { fileBuffer = e.target.result; };
  reader.readAsArrayBuffer(file);
}

function clearFile() {
  fileBuffer = outputBlob = null;
  fileInput.value = '';
  document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('runBtn').disabled = true;
  document.getElementById('resultsBox').classList.remove('show');
  document.getElementById('progressWrap').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = label;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
}

async function runRouting() {
  if (!fileBuffer) return;
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('resultsBox').classList.remove('show');
  document.getElementById('progressWrap').classList.add('show');
  document.getElementById('runBtn').disabled = true;

  const hvToContractor = document.getElementById('hvToContractor').checked;

  try {
    setProgress(10, 'קורא קובץ...');
    await new Promise(r => setTimeout(r, 30));

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(fileBuffer);
    const ws = wb.worksheets[0];

    setProgress(20, 'מאתר כותרות...');
    await new Promise(r => setTimeout(r, 20));

    // מצא שורת כותרות (מזהה ייחודי לדוח הזה: VALUE_CATEGORY / CLASSIFICATION_LINES)
    let headerRowNum = -1;
    let headers = [];
    ws.eachRow((row, rn) => {
      if (headerRowNum !== -1) return;
      const vals = row.values.map(v => String(v||''));
      if (vals.includes('VALUE_CATEGORY') || vals.includes('CLASSIFICATION_LINES')) {
        headerRowNum = rn;
        headers = vals; // index 1-based (index 0 undefined in exceljs)
      }
    });

    if (headerRowNum === -1) {
      showError('לא נמצאה שורת כותרות. ודא שזה הדוח הנכון (עם עמודת VALUE_CATEGORY).');
      document.getElementById('progressWrap').classList.remove('show');
      document.getElementById('runBtn').disabled = false;
      return;
    }

    const ci = name => headers.indexOf(name);

    setProgress(30, 'מנתב שורות...');
    await new Promise(r => setTimeout(r, 20));

    const outWb = new ExcelJS.Workbook();
    const outWs = outWb.addWorksheet('ניתוב');

    const HIDDEN_COLS = new Set(['HAS_STEP_1123','STATUS_DRAFT_WG','IMPORTER_NO','PERSONAL_IMPORTING']);
    // אינדקסים (1-based, כמו ב-ExcelJS) של העמודות המקוריות שכן יוצגו
    const keepIdx = [];
    for (let i = 1; i < headers.length; i++) {
      if (!HIDDEN_COLS.has(headers[i])) keepIdx.push(i);
    }

    const newHeaders = [...keepIdx.map(i => headers[i]), 'רמת_סיכון', 'סיבה'];
    outWs.addRow(newHeaders);

    const headerRow = outWs.getRow(1);
    headerRow.eachCell(cell => {
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A1A1A' } };
      cell.font = { name: 'Arial', bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
    });
    headerRow.height = 18;

    const fills = {
      red:    { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFCDD2' } },
      yellow: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF9C4' } },
      green:  { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFC8E6C9' } },
    };
    const labels = { red: '🔴 חשש גבוה', yellow: '🟡 חשש בינוני', green: '🟢 ללא חשש' };

    let redC = 0, yelC = 0, grnC = 0;
    let contractorC = 0, internalC = 0;
    const totalRows = ws.rowCount - headerRowNum;

    ws.eachRow((row, rn) => {
      if (rn <= headerRowNum) return;

      const get = name => {
        const idx = ci(name);
        return idx > 0 ? row.getCell(idx).value : '';
      };

      const description = String(get('DESCRIPTION') || '');
      const valueCategory = String(get('VALUE_CATEGORY') || '').trim().toUpperCase();

      const [level, reason] = getRisk(description);

      if (level === 'red') redC++;
      else if (level === 'yellow') yelC++;
      else grnC++;

      // ── לוגיקת ניתוב ──
      // אדום/צהוב => תמיד פנימי.
      // ירוק + LOW => קבלן.
      // ירוק + HV => לפי ההגדרה (checkbox).
      let route;
      if (level === 'red' || level === 'yellow') {
        route = 'פנימי';
      } else if (valueCategory === 'LOW') {
        route = 'קבלן';
      } else if (valueCategory === 'HV' && hvToContractor) {
        route = 'קבלן';
      } else {
        route = 'פנימי';
      }

      if (route === 'קבלן') { contractorC++; }
      else { internalC++; }

      const rowVals = keepIdx.map(i => row.getCell(i).value);
      rowVals.push(labels[level], reason);

      const newRow = outWs.addRow(rowVals);
      newRow.eachCell(cell => {
        cell.fill = fills[level];
        cell.font = { name: 'Arial', size: 10 };
        cell.alignment = { horizontal: 'right', vertical: 'middle' };
      });
      newRow.height = 16;

      if (rn % 50 === 0) {
        const pct = 30 + Math.round((rn - headerRowNum) / totalRows * 55);
        setProgress(pct, `מעבד שורה ${rn - headerRowNum} מתוך ${totalRows}...`);
      }
    });

    setProgress(88, 'מגדיר רוחב עמודות...');
    await new Promise(r => setTimeout(r, 20));

    newHeaders.forEach((h, i) => {
      const col = outWs.getColumn(i + 1);
      const hs = String(h||'');
      if (hs === 'DESCRIPTION') col.width = 40;
      else if (hs === 'SHIPPER') col.width = 24;
      else if (hs === 'סיבה') col.width = 26;
      else if (hs === 'רמת_סיכון') col.width = 16;
      else col.width = 14;
    });

    outWs.views = [{ state: 'frozen', ySplit: 1 }];

    setProgress(95, 'שומר קובץ...');
    await new Promise(r => setTimeout(r, 20));

    const buf = await outWb.xlsx.writeBuffer();
    outputBlob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    setProgress(100, 'הניתוב הושלם ✓');

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="num">${redC+yelC+grnC}</div><div class="lbl">סה"כ שורות</div></div>
      <div class="stat-card c-red"><div class="num">${redC}</div><div class="lbl">🔴 חשש גבוה</div></div>
      <div class="stat-card c-yellow"><div class="num">${yelC}</div><div class="lbl">🟡 חשש בינוני</div></div>
      <div class="stat-card c-green"><div class="num">${grnC}</div><div class="lbl">🟢 ללא חשש</div></div>
      <div class="stat-card c-blue"><div class="num">${internalC}</div><div class="lbl">מנותב פנימי</div></div>
      <div class="stat-card c-blue"><div class="num">${contractorC}</div><div class="lbl">מנותב לקבלן</div></div>
    `;

    document.getElementById('resultsBox').classList.add('show');
    document.getElementById('runBtn').disabled = false;

    document.getElementById('downloadBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(outputBlob);
      a.download = 'ניתוב_קבלן_פנימי.xlsx';
      a.click();
    };

  } catch(err) {
    showError('שגיאה: ' + err.message);
    document.getElementById('progressWrap').classList.remove('show');
    document.getElementById('runBtn').disabled = false;
  }
}
</script>
</body>
</html>
